  <rect x="540" y="198" width="80" height="52" rx="6" fill="#1d4ed8" opacity="0.35" stroke="#3b82f6" stroke-width="1"/>
  <text x="548" y="218" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="600">OS-301</text>
