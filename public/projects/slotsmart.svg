  <circle cx="295" cy="297" r="14" fill="#3b82f6" opacity="0.2"/>
  <path d="M290 297 L294 301 L301 292" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="320" y="293" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Conflict-Free Solver Engine</text>
