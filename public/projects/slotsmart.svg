  <text x="85" y="122" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="700">RESOURCE ALLOCATION</text>
  
  <rect x="85" y="136" width="140" height="32" rx="6" fill="#1e293b"/>
